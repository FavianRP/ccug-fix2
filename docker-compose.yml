version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: ccug-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-ccugadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-ccugadmin123}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-ccug}
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - ccug-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./ccug-backend
      dockerfile: Dockerfile
    container_name: ccug-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME:-ccugadmin}:${MONGO_ROOT_PASSWORD:-ccugadmin123}@mongodb:27017/${MONGO_DATABASE:-ccug}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-ccugsecret}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - ccug-network
    command: npm start

  # Frontend
  frontend:
    build:
      context: ./ccug-frontend
      dockerfile: Dockerfile
    container_name: ccug-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://backend:5000
    depends_on:
      - backend
    networks:
      - ccug-network
    command: npm start

networks:
  ccug-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
